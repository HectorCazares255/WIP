<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clocked Out</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="message_back">
    <div class="clockin_message_box">
        <h1>You Have Clocked Out</h1>

        <p><b>Start Time: </b>&nbsp; {{ start_time }}</p>
        <p><b>End Time: </b>&nbsp; {{ end_time }}</p>
        <p><b>Total Time Worked:</b>&nbsp; {{ total_hours }} hour(s) {{ total_minutes }} minute(s)</p>

        {% if warning %}
            <p class="warning">{{ warning }}</p>
        {% endif %}

        <div class="clockin_buttons">
            <form action="{{ url_for('index') }}" method="get">
                <button type="submit">
                <img class="logo_size" src="{{ url_for('static', filename='home.png') }}" alt="Home Icon" class="home_icon">
                    Back to Home</button>
            </form>

            <form action="{{ url_for('logout') }}" method="get">
                <button type="submit">
                <img class="logo_size" src="{{ url_for('static', filename='logout.png') }}" alt="Logout Icon" class="logout_icon">
                    Logout</button>
            </form>
        </div>
    </div>
</body>
</html>
