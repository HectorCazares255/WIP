<html>
    <head>
        <title>Clock In/Out Site</title>
    </head>
    <body>
        <h1>Employee Time Clock</h1>

        <p><b>Status:</b> {{ "Clocked In" if clocked_in == "Yes" else "Clocked Out" }}</p>
        <p><b>Clock In:</b> {{ clock_in if clock_in else "—" }}</p>
        <p><b>Clock Out:</b> {{ clock_out if clock_out else "—" }}</p>

        <p><b>Total:</b> {{ total_hours }} hour(s) {{ total_minutes }} minute(s)</p>

        <form action="/clock-in" method="POST">
            <button type="submit">Clock In</button>
        </form>

        <form action="/clock-out" method="POST">
            <button type="submit">Clock Out</button>
        </form>
    </body>
</html>
